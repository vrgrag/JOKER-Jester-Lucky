name: jester_lucky_shell
description: "Jester Lucky — a fast-paced royal-treasury defense game."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native game engine (white part).
  flame: ^1.35.1

  # Shell + gray-flow stack.
  # NOTE: versions intentionally staggered from other projects — see
  # .cursor/rules/gray_part_pitfalls.md §"Library Versions" for
  # background on why version diversity matters.
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.3
  http: ^1.3.0
  url_launcher: ^6.3.1
  appsflyer_sdk: ^6.17.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1

  # Microsoft Clarity — session replay of the native surface + custom
  # funnel events. See .cursor/rules/clarity_analytics.mdc (mirrored
  # into JOKER from gray_part_flow — same event/tag vocabulary so the
  # dashboard slices identically for both apps).
  clarity_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Background_RoyalTreasury.webp
    - assets/Collectible_LuckyCoin.webp
    - assets/Enemy_GoblinThief.webp
    - assets/Enemy_MimicChest.webp
    - assets/Game_Name.webp
    - assets/Hero.webp
    - assets/Horizontal_Loading.webp
    - assets/Vertical_Loading.webp
    - assets/Icon.png
    - assets/icon2.png
    - assets/Obstacle_SpinningCards.webp
    - assets/Powerup_Jackpot.webp
    - assets/jester_extra_pack/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon2.png"
  min_sdk_android: 30
  # Solid brand-ink background so the adaptive-icon mask never shows a
  # white or transparent stripe on the sides.
  adaptive_icon_background: "#1A1206"
  adaptive_icon_foreground: "assets/icon2.png"
  # Inset the foreground so the whole design lands inside the 66% safe
  # zone of AdaptiveIconDrawable — nothing gets clipped by the mask on
  # circular / squircle launchers.
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: false
